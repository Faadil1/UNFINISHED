<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><meta name='theme-color' content='#f2eee4'><title>UNFINISHED — Mobile Test</title><style>:root{--bg:#f2eee4;--ink:#171717;--muted:#6d685f;--line:rgba(23,23,23,.15);--paper:rgba(255,255,255,.88)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}button,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;font-weight:900;letter-spacing:.14em}.phase{font-size:11px;color:var(--muted);letter-spacing:.12em}.scene{position:relative;min-height:0;padding:0 10px}canvas{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:24px;background:linear-gradient(#ebe5d8,#faf8f1)}.controls{padding:10px 14px max(18px,env(safe-area-inset-bottom));min-height:150px;display:flex;align-items:center;justify-content:center}.card{width:min(640px,100%);max-height:45vh;overflow:auto;background:var(--paper);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.07)}.hidden{display:none!important}.prompt{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;margin-bottom:10px}.neutral{font-size:14px;color:var(--muted);line-height:1.45;margin:0 0 14px}.primary,.secondary{width:100%;min-height:50px;padding:13px 16px;border-radius:15px;font-weight:850;letter-spacing:.02em}.primary{border:0;background:#171717;color:white}.secondary{border:1px solid var(--line);background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:82px;border:1px solid var(--line);background:white;border-radius:18px;padding:12px;text-align:left;transition:transform .12s ease,box-shadow .12s ease}.choice:active{transform:scale(.98)}.choice strong{display:block;font-size:15px}.choice span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.joyrow{display:flex;justify-content:center;gap:12px}.joy{width:78px;height:78px;border-radius:50%;border:1px solid var(--line);background:white;font-size:24px;font-weight:900;touch-action:none}.joy:active{transform:scale(.96)}.badge{position:absolute;top:18px;left:50%;transform:translate(-50%,-5px);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:12px;font-weight:850;opacity:0;transition:.2s;white-space:nowrap}.badge.show{opacity:1;transform:translate(-50%,0)}.report textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:13px;padding:10px;background:white;resize:none}.report label{font-size:12px;font-weight:760;line-height:1.35;display:block;margin-top:10px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}.scale button{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 0}.scale button.sel{background:#171717;color:white}.anchors{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:-7px;margin-bottom:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.small{font-size:10px;color:var(--muted);line-height:1.35;margin-top:8px}.debug{display:none;position:absolute;right:18px;bottom:18px;font:9px ui-monospace;background:rgba(255,255,255,.8);padding:5px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}.debug.on{display:block}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><div class='app'><div class='top'><div class='brand'>UNFINISHED</div><div class='phase' id='phase'>01 / 04</div></div><div class='scene'><canvas id='c'></canvas><div class='badge' id='badge'></div><div class='debug' id='debug'>v3</div></div><div class='controls'><div class='card' id='intro'><div class='prompt'>Mobile interaction test</div><p class='neutral'>Explore the scene in front of you.</p><button class='primary' id='start'>START</button></div><div class='card hidden' id='complete'><div class='prompt'>Choose one</div><div class='grid'><button class='choice' data-complete='CONNECT'><strong>↔ CONNECT</strong><span>join the path</span></button><button class='choice' data-complete='RISE'><strong>↥ RISE</strong><span>take it upward</span></button></div></div><div class='card hidden' id='play'><div class='prompt'>Your move</div><div class='joyrow'><button class='joy' id='left' aria-label='Move left'>←</button><button class='joy' id='up' aria-label='Move up'>↑</button><button class='joy' id='right' aria-label='Move right'>→</button></div><button class='secondary' id='skip' style='margin-top:10px'>I'M DONE HERE</button></div><div class='card hidden' id='leave'><div class='prompt'>Leave a starting state</div><div class='grid'><button class='choice' data-stem='ARC'><strong>⌒ ARC</strong><span>curved start</span></button><button class='choice' data-stem='STEP'><strong>⌜ STEP</strong><span>stepped start</span></button></div></div><div class='card report hidden' id='report'><div class='prompt'>Short debrief</div><label>In your own words, what just happened?</label><textarea id='what' autocomplete='off'></textarea><label>Who or what do you think created the starting state?</label><textarea id='sourceRecall' autocomplete='off'></textarea><label>What did the starting state contribute?</label><textarea id='priorText' autocomplete='off'></textarea><label>What did you contribute?</label><textarea id='selfText' autocomplete='off'></textarea><label>How much did the starting shape affect your choice?</label><div class='scale' id='constraint'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><div class='anchors'><span>Not at all</span><span>A lot</span></div><label>How much did the source of the starting state matter?</label><div class='scale' id='origin'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><div class='anchors'><span>Not at all</span><span>A lot</span></div><label>How social did this feel?</label><div class='scale' id='social'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><div class='anchors'><span>Not social</span><span>Very social</span></div><label>How enjoyable was it?</label><div class='scale' id='fun'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><div class='anchors'><span>Not enjoyable</span><span>Very enjoyable</span></div><div class='actions'><button class='secondary' id='copy'>COPY JSON</button><button class='primary' id='restart'>NEW TEST</button></div><div class='small' id='summary'></div></div></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,S={};const cards=['intro','complete','play','leave','report'];const outcomes={'ARC|CONNECT':'GATEWAY','ARC|RISE':'ARCH CLIMB','STEP|CONNECT':'CROSSING','STEP|RISE':'STAIR TOWER'};const qp=new URLSearchParams(location.search);function valid(v,a){return a.includes(v)?v:null}function condition(){const m=valid((qp.get('mode')||'').toUpperCase(),['HUMAN','WORLD']),p=valid((qp.get('prior')||'').toUpperCase(),['ARC','STEP']);return{mode:m||(Math.random()<.5?'HUMAN':'WORLD'),prior:p||(Math.random()<.5?'ARC':'STEP'),controlled:!!(m&&p),label:qp.get('run')||null}}function show(id){cards.forEach(k=>$(k).classList.toggle('hidden',k!==id))}function setPhase(t){$('phase').textContent=t}function badge(t){$('badge').textContent=t;$('badge').classList.add('show');setTimeout(()=>$('badge').classList.remove('show'),1800)}function haptic(){try{navigator.vibrate?.(24)}catch{}}function log(type,e={}){S.events.push({type,t:Math.round(performance.now()-S.t0),...e});$('debug').textContent=`v3 · ${S.mode}/${S.prior} · ${type}`}function fresh(){const q=condition();S={version:3,t0:performance.now(),mode:q.mode,prior:q.prior,controlled:q.controlled,runLabel:q.label,name:'MAYA',complete:null,outcome:null,avatar:{x:.13,y:.78},events:[],firstPostReveal:null,used:false,skipped:false,next:null,constraintScore:null,originScore:null,socialScore:null,funScore:null,morph:1};['what','sourceRecall','priorText','selfText'].forEach(id=>$(id).value='');document.querySelectorAll('.scale button').forEach(b=>b.classList.remove('sel'));$('debug').classList.toggle('on',qp.get('debug')==='1');setPhase('01 / 04');show('intro');draw()}function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;W=r.width;H=r.height;x.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);function start(){S.t0=performance.now();S.events=[];log('START',{mode:S.mode,prior:S.prior,controlled:S.controlled,runLabel:S.runLabel});setPhase('02 / 04');show('complete');draw();setTimeout(()=>badge(`${S.mode==='HUMAN'?S.name:'WORLD'} · ${S.prior} → ?`),700)}function paths(){if(!S.complete)return[];return{'ARC|CONNECT':[[.12,.78],[.30,.65],[.50,.56],[.70,.62],[.88,.48]],'ARC|RISE':[[.12,.78],[.28,.70],[.42,.57],[.54,.42],[.66,.28],[.83,.20]],'STEP|CONNECT':[[.12,.78],[.30,.74],[.44,.67],[.59,.67],[.72,.58],[.88,.48]],'STEP|RISE':[[.12,.78],[.30,.70],[.43,.58],[.55,.46],[.68,.34],[.82,.22]]}[`${S.prior}|${S.complete}`]}function first(a){if(!S.firstPostReveal){S.firstPostReveal=a;log('FIRST_POST_REVEAL',{action:a,latency:Math.round(performance.now()-S.reveal)})}}function animateMorph(){const st=performance.now(),dur=520;function tick(n){S.morph=Math.min(1,(n-st)/dur);draw();if(S.morph<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}function chooseComplete(v){S.complete=v;S.outcome=outcomes[`${S.prior}|${v}`];S.reveal=performance.now();S.morph=0;log('COMPLETE',{v,outcome:S.outcome});setPhase('03 / 04');show('play');haptic();badge(`${S.mode==='HUMAN'?S.name:'WORLD'} + YOU · ${S.outcome}`);animateMorph()}function move(dx,dy){if(!S.complete||S.used||S.skipped)return;first('MOVE');S.avatar.x=Math.max(.05,Math.min(.95,S.avatar.x+dx));S.avatar.y=Math.max(.12,Math.min(.86,S.avatar.y+dy));log('MOVE',{x:+S.avatar.x.toFixed(2),y:+S.avatar.y.toFixed(2)});const p=paths(),g=p[p.length-1];if(Math.hypot(S.avatar.x-g[0],S.avatar.y-g[1])<.13){S.used=true;log('ROUTE_USED',{outcome:S.outcome});haptic();badge('PATH USED');setTimeout(toLeave,450)}draw()}function skip(){if(S.used)return;first('DONE_WITHOUT_USE');S.skipped=true;log('ROUTE_SKIPPED');toLeave()}function toLeave(){setPhase('04 / 04');show('leave');draw()}function chooseStem(v){S.next=v;log('NEXT_STEM',{v});show('report');setPhase('DEBRIEF');haptic();badge(`YOU · ${v} → ?`);draw();summary()}function summary(){$('summary').textContent=`${S.mode}/${S.prior}; ${S.complete||'—'}→${S.outcome||'—'}; first=${S.firstPostReveal||'NONE'}; used=${S.used?'yes':'no'}; Constraint=${S.constraintScore||'—'}; Origin=${S.originScore||'—'}; Social=${S.socialScore||'—'}; Fun=${S.funScore||'—'}`}function scale(id,key){[...$(id).children].forEach((b,i)=>b.onclick=()=>{S[key]=i+1;[...$(id).children].forEach(q=>q.classList.remove('sel'));b.classList.add('sel');log('RATING',{key,value:i+1});summary()})}scale('constraint','constraintScore');scale('origin','originScore');scale('social','socialScore');scale('fun','funScore');function lerp(a,b,t){return a+(b-a)*t}function draw(){if(!W||!H)return;x.clearRect(0,0,W,H);x.fillStyle='#d9d2c4';x.fillRect(0,H*.82,W,H*.18);const sx=v=>v*W,sy=v=>v*H;x.lineCap='round';x.lineJoin='round';if($('intro').classList.contains('hidden')){x.strokeStyle='#171717';x.lineWidth=16;if(!S.complete){x.beginPath();if(S.prior==='ARC'){x.moveTo(sx(.16),sy(.72));x.quadraticCurveTo(sx(.38),sy(.40),sx(.56),sy(.60))}else{x.moveTo(sx(.16),sy(.72));x.lineTo(sx(.32),sy(.72));x.lineTo(sx(.32),sy(.60));x.lineTo(sx(.50),sy(.60))}x.stroke();x.strokeStyle='#8c8578';x.lineWidth=4;x.beginPath();x.arc(sx(.58),sy(.60),10,0,Math.PI*2);x.stroke()}else{const p=paths(),count=Math.max(2,Math.ceil(p.length*S.morph));x.beginPath();p.slice(0,count).forEach((q,i)=>i?x.lineTo(sx(q[0]),sy(q[1])):x.moveTo(sx(q[0]),sy(q[1])));x.stroke();if(S.morph>=1){const g=p[p.length-1];x.fillStyle='#171717';x.beginPath();x.arc(sx(g[0]),sy(g[1]),11,0,Math.PI*2);x.fill()}x.fillStyle='#625c53';x.beginPath();x.arc(sx(S.avatar.x),sy(S.avatar.y)-8,7,0,Math.PI*2);x.fill();x.fillRect(sx(S.avatar.x)-5,sy(S.avatar.y),10,18)}x.fillStyle='rgba(23,23,23,.76)';x.font='800 14px system-ui';const who=S.mode==='HUMAN'?S.name:'WORLD';x.fillText(S.complete?`${who} + YOU · ${S.outcome}`:`${who} · ${S.prior} → ?`,16,28)}}$('start').onclick=start;document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>chooseComplete(b.dataset.complete));document.querySelectorAll('[data-stem]').forEach(b=>b.onclick=()=>chooseStem(b.dataset.stem));$('left').onclick=()=>move(-.07,0);$('right').onclick=()=>move(.07,0);$('up').onclick=()=>move(0,-.07);$('skip').onclick=skip;$('copy').onclick=()=>{S.whatHappened=$('what').value.trim();S.sourceRecall=$('sourceRecall').value.trim();S.priorContribution=$('priorText').value.trim();S.selfContribution=$('selfText').value.trim();S.completedAt=new Date().toISOString();const j=JSON.stringify(S,null,2);navigator.clipboard?.writeText(j).then(()=>badge('JSON COPIED')).catch(()=>prompt('Copy this JSON',j))};$('restart').onclick=fresh;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-.05,0);if(e.key==='ArrowRight')move(.05,0);if(e.key==='ArrowUp')move(0,-.05)});fresh();resize();</script></body></html>
