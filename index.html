<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee4">
<title>UNFINISHED — Intelligent Causal Loop V5.2.2</title>
<style>
html:not(.v521ready) body{visibility:hidden;pointer-events:none}
html.boot-failed body{visibility:visible;pointer-events:auto}
body{margin:0;background:#f2eee4;color:#171717;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#bootError{display:none;padding:24px}
html.boot-failed #bootError{display:block}
</style>
</head>
<body>
<div id="bootError">UNFINISHED could not load the validated runtime.</div>
<script>
(async()=>{
  try{
    const r=await fetch('/core-v51.html',{cache:'no-store'});
    if(!r.ok)throw new Error('core '+r.status);
    let html=await r.text();
    const readyStyle='<style>html:not(.v521ready) body{visibility:hidden;pointer-events:none}</style>';
    const patches='<script src="/v52-patch.js"><\/script><script src="/v521-fix.js"><\/script><script>(function(){if(!document.documentElement.classList.contains("v521ready")){document.documentElement.classList.add("boot-failed");document.body.innerHTML="<pre style=\"font:14px system-ui;padding:24px\">UNFINISHED V5.2.2 readiness check failed.</pre>";return;}window.__UNFINISHED_RUNTIME__="5.2.2";document.title="UNFINISHED — Intelligent Causal Loop V5.2.2";if(window.S)S.version="5.2.2";if(document.getElementById("debug"))document.getElementById("debug").textContent="v5.2.2";document.documentElement.classList.add("v522ready");})();<\/script>';
    html=html.replace('</head>',readyStyle+'</head>').replace('</body>',patches+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.documentElement.classList.add('boot-failed');
    document.body.innerHTML='<pre style="font:14px system-ui;padding:24px">UNFINISHED could not load. '+String(err)+'</pre>';
  }
})();
</script>
</body>
</html>
