<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>UNFINISHED Cold Test V2</title><style>:root{--bg:#f2eee4;--ink:#171717;--muted:#6e6a61;--line:rgba(23,23,23,.16)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}button,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between}.brand{font-size:13px;font-weight:900;letter-spacing:.12em}.phase{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.scene{position:relative;min-height:0;padding:0 10px}canvas{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:24px;background:linear-gradient(#ece7db,#faf8f2)}.controls{padding:10px 14px max(18px,env(safe-area-inset-bottom));min-height:150px;display:flex;align-items:center;justify-content:center}.card{width:min(640px,100%);max-height:42vh;overflow:auto;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.07)}.hidden{display:none!important}.primary,.secondary{width:100%;padding:14px 16px;border-radius:15px;font-weight:800}.primary{border:0;background:#171717;color:white}.secondary{border:1px solid var(--line);background:white}.prompt{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:78px;border:1px solid var(--line);background:white;border-radius:18px;padding:11px;text-align:left}.choice strong{display:block;font-size:14px}.choice span{font-size:11px;color:var(--muted)}.joyrow{display:flex;justify-content:center;gap:12px}.joy{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:white;font-size:22px;font-weight:900;touch-action:none}.badge{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;transition:.2s}.badge.show{opacity:1}.report textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:13px;padding:9px;background:white;resize:none}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}.scale button{border:1px solid var(--line);background:white;border-radius:9px;padding:8px}.scale button.sel{background:#171717;color:white}.report label{font-size:12px;font-weight:750;display:block;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.small{font-size:11px;color:var(--muted);line-height:1.35;margin-top:8px}.debug{position:absolute;right:18px;bottom:18px;font:9px ui-monospace;background:rgba(255,255,255,.75);padding:5px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}.neutral{font-size:14px;color:var(--muted);margin:0 0 12px}</style></head><body><div class='app'><div class='top'><div class='brand'>UNFINISHED</div><div class='phase' id='phase'>test 02</div></div><div class='scene'><canvas id='c'></canvas><div class='badge' id='badge'></div><div class='debug' id='debug'>v2</div></div><div class='controls'>
<div class='card' id='intro'><div class='prompt'>Test mobile</div><p class='neutral'>Explore ce qui est devant toi.</p><button class='primary' id='start'>COMMENCER</button></div>
<div class='card hidden' id='complete'><div class='prompt'>Choisis</div><div class='grid'><button class='choice' data-complete='CONNECT'><strong>↔ CONNECT</strong><span>relier</span></button><button class='choice' data-complete='RISE'><strong>↥ RISE</strong><span>monter</span></button></div></div>
<div class='card hidden' id='play'><div class='prompt'>À toi</div><div class='joyrow'><button class='joy' id='left'>←</button><button class='joy' id='up'>↑</button><button class='joy' id='right'>→</button></div><button class='secondary' id='skip' style='margin-top:10px'>CONTINUER</button></div>
<div class='card hidden' id='leave'><div class='prompt'>Choisis un départ</div><div class='grid'><button class='choice' data-stem='ARC'><strong>⌒ ARC</strong><span>courbe</span></button><button class='choice' data-stem='STEP'><strong>⌜ STEP</strong><span>marche</span></button></div></div>
<div class='card report hidden' id='report'><div class='prompt'>Quelques questions</div><label>Avec tes propres mots, qu’est-ce qui vient de se passer ?</label><textarea id='what'></textarea><label>Qu’est-ce que l’état initial a apporté à ton expérience ?</label><textarea id='priorText'></textarea><label>Qu’est-ce que toi, tu as apporté ?</label><textarea id='selfText'></textarea><label>À quel point l’origine affichée de l’état initial comptait-elle ?</label><div class='scale' id='origin'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><label>À quel point l’expérience t’a-t-elle semblé sociale ?</label><div class='scale' id='social'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><label>À quel point était-ce plaisant à faire ?</label><div class='scale' id='fun'><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><div class='actions'><button class='secondary' id='copy'>COPIER JSON</button><button class='primary' id='restart'>NOUVEAU TEST</button></div><div class='small' id='summary'></div></div>
</div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,S={};const cards=['intro','complete','play','leave','report'];const outcomes={'ARC|CONNECT':'GATEWAY','ARC|RISE':'ARCH CLIMB','STEP|CONNECT':'CROSSING','STEP|RISE':'STAIR TOWER'};const qp=new URLSearchParams(location.search);function valid(v,a){return a.includes(v)?v:null}function condition(){const m=valid((qp.get('mode')||'').toUpperCase(),['HUMAN','WORLD']);const p=valid((qp.get('prior')||'').toUpperCase(),['ARC','STEP']);return{mode:m|| (Math.random()<.5?'HUMAN':'WORLD'),prior:p|| (Math.random()<.5?'ARC':'STEP'),controlled:!!(m&&p),label:qp.get('run')||null}}function show(id){cards.forEach(k=>$(k).classList.toggle('hidden',k!==id))}function badge(t){$('badge').textContent=t;$('badge').classList.add('show');setTimeout(()=>$('badge').classList.remove('show'),1700)}function log(type,e={}){S.events.push({type,t:Math.round(performance.now()-S.t0),...e});$('debug').textContent=`v2 · ${S.mode}/${S.prior} · ${type}`}function fresh(){const q=condition();S={version:2,t0:performance.now(),mode:q.mode,prior:q.prior,controlled:q.controlled,runLabel:q.label,name:'MAYA',complete:null,outcome:null,avatar:{x:.13,y:.78},events:[],firstPostReveal:null,used:false,skipped:false,next:null,originScore:null,socialScore:null,funScore:null};$('phase').textContent='test 02';['what','priorText','selfText'].forEach(id=>$(id).value='');document.querySelectorAll('.scale button').forEach(b=>b.classList.remove('sel'));show('intro');draw()}function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;W=r.width;H=r.height;x.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);function start(){S.t0=performance.now();S.events=[];log('START',{mode:S.mode,prior:S.prior,controlled:S.controlled,runLabel:S.runLabel});$('phase').textContent='inherit';show('complete');draw();setTimeout(()=>badge(`${S.mode==='HUMAN'?S.name:'WORLD'} · ${S.prior} → ?`),900)}function paths(){if(!S.complete)return[];return{'ARC|CONNECT':[[.12,.78],[.30,.65],[.50,.56],[.70,.62],[.88,.48]],'ARC|RISE':[[.12,.78],[.28,.70],[.42,.57],[.54,.42],[.66,.28],[.83,.20]],'STEP|CONNECT':[[.12,.78],[.30,.74],[.44,.67],[.59,.67],[.72,.58],[.88,.48]],'STEP|RISE':[[.12,.78],[.30,.70],[.43,.58],[.55,.46],[.68,.34],[.82,.22]]}[`${S.prior}|${S.complete}`]}function first(a){if(!S.firstPostReveal){S.firstPostReveal=a;log('FIRST_POST_REVEAL',{action:a,latency:Math.round(performance.now()-S.reveal)})}}function chooseComplete(v){S.complete=v;S.outcome=outcomes[`${S.prior}|${v}`];S.reveal=performance.now();log('COMPLETE',{v,outcome:S.outcome});show('play');$('phase').textContent='consequence';badge(`${S.mode==='HUMAN'?S.name:'WORLD'} + YOU · ${S.outcome}`);draw()}function move(dx,dy){if(!S.complete||S.used||S.skipped)return;first('MOVE');S.avatar.x=Math.max(.05,Math.min(.95,S.avatar.x+dx));S.avatar.y=Math.max(.12,Math.min(.86,S.avatar.y+dy));log('MOVE',{x:+S.avatar.x.toFixed(2),y:+S.avatar.y.toFixed(2)});const p=paths(),g=p[p.length-1];if(Math.hypot(S.avatar.x-g[0],S.avatar.y-g[1])<.13){S.used=true;log('ROUTE_USED',{outcome:S.outcome});badge('OK');setTimeout(()=>toLeave(),450)}draw()}function skip(){if(S.used)return;first('CONTINUE_WITHOUT_USE');S.skipped=true;log('ROUTE_SKIPPED');toLeave()}function toLeave(){show('leave');$('phase').textContent='leave';draw()}function chooseStem(v){S.next=v;log('NEXT_STEM',{v});show('report');$('phase').textContent='debrief';badge(`YOU · ${v} → ?`);draw();summary()}function summary(){$('summary').textContent=`${S.mode}/${S.prior}; ${S.complete||'—'}→${S.outcome||'—'}; first=${S.firstPostReveal||'NONE'}; used=${S.used?'yes':'no'}; skipped=${S.skipped?'yes':'no'}; Origin=${S.originScore||'—'}/5; Social=${S.socialScore||'—'}/5; Fun=${S.funScore||'—'}/5`}function scale(id,key){[...$(id).children].forEach((b,i)=>b.onclick=()=>{S[key]=i+1;[...$(id).children].forEach(q=>q.classList.remove('sel'));b.classList.add('sel');log('RATING',{key,value:i+1});summary()})}scale('origin','originScore');scale('social','socialScore');scale('fun','funScore');function draw(){if(!W||!H)return;x.clearRect(0,0,W,H);x.fillStyle='#d8d1c3';x.fillRect(0,H*.82,W,H*.18);const sx=v=>v*W,sy=v=>v*H;x.lineCap='round';x.lineJoin='round';if($('intro').classList.contains('hidden')){x.strokeStyle='#171717';x.lineWidth=16;if(!S.complete){x.beginPath();if(S.prior==='ARC'){x.moveTo(sx(.16),sy(.72));x.quadraticCurveTo(sx(.38),sy(.40),sx(.56),sy(.60))}else{x.moveTo(sx(.16),sy(.72));x.lineTo(sx(.32),sy(.72));x.lineTo(sx(.32),sy(.60));x.lineTo(sx(.50),sy(.60))}x.stroke();x.strokeStyle='#8c8578';x.lineWidth=4;x.beginPath();x.arc(sx(.58),sy(.60),10,0,Math.PI*2);x.stroke()}else{const p=paths();x.beginPath();p.forEach((q,i)=>i?x.lineTo(sx(q[0]),sy(q[1])):x.moveTo(sx(q[0]),sy(q[1])));x.stroke();const g=p[p.length-1];x.fillStyle='#171717';x.beginPath();x.arc(sx(g[0]),sy(g[1]),11,0,Math.PI*2);x.fill();x.fillStyle='#6a6358';x.beginPath();x.arc(sx(S.avatar.x),sy(S.avatar.y)-8,7,0,Math.PI*2);x.fill();x.fillRect(sx(S.avatar.x)-5,sy(S.avatar.y),10,18)}x.fillStyle='rgba(23,23,23,.7)';x.font='700 12px system-ui';const who=S.mode==='HUMAN'?S.name:'WORLD';x.fillText(S.complete?`${who} + YOU · ${S.outcome}`:`${who} · ${S.prior} → ?`,16,26)}}$('start').onclick=start;document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>chooseComplete(b.dataset.complete));document.querySelectorAll('[data-stem]').forEach(b=>b.onclick=()=>chooseStem(b.dataset.stem));$('left').onclick=()=>move(-.07,0);$('right').onclick=()=>move(.07,0);$('up').onclick=()=>move(0,-.07);$('skip').onclick=skip;$('copy').onclick=()=>{S.whatHappened=$('what').value.trim();S.priorContribution=$('priorText').value.trim();S.selfContribution=$('selfText').value.trim();S.completedAt=new Date().toISOString();const j=JSON.stringify(S,null,2);navigator.clipboard?.writeText(j).then(()=>badge('JSON COPIÉ')).catch(()=>prompt('Copie ce JSON',j))};$('restart').onclick=fresh;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-.05,0);if(e.key==='ArrowRight')move(.05,0);if(e.key==='ArrowUp')move(0,-.05)});fresh();resize();</script></body></html>
