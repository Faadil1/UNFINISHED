name: Decentraland SDK7 Build

on:
  push:
    branches: [main]
    paths:
      - 'decentraland/**'
      - '.github/workflows/dcl-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decentraland
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build SDK7 scene
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-dcl-build
          path: decentraland/bin
          if-no-files-found: error
